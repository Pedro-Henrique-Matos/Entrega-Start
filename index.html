<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashbacks de mentiras e verdades</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Conferi aí</h1>
        <nav>
            <a href="#">Início</a>
        </nav>
    </header>
    <main>
        <h2>Descubra a verdade passando o mouse</h2>
        <article class="cartao">
            <div class="cartao-interno">
                <div class="cartao-frente">
                    <img src="https://miro.medium.com/v2/resize:fit:828/format:webp/0*bi95AP3ObUezja4d.jpg" alt="Pinguim-Solitário">
                    <p>Pinguins conseguem voar como pássaros!</p>
                </div>
                <div class="cartao-verso">
                    <img src="https://miro.medium.com/v2/resize:fit:828/format:webp/0*bi95AP3ObUezja4d.jpg" alt="Pinguim-Solitário" class="cartao-imagem">
                    <p>Pinguins não voam, mas são excelentes nadadores.</p>
                </div>
            </div>
        </article>
    </main>

    <footer>
        <p>Projeto feito por Pedro</p>
    </footer>
    
</body>
</html>
